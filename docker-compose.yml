# Local PostgreSQL for development:  docker compose up -d db
# Then in .env:  DATABASE_URL=postgresql://talentai:talentai@localhost:5432/talentai
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: talentai
      POSTGRES_PASSWORD: talentai
      POSTGRES_DB: talentai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentai"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
